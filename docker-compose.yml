services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./:/workspace"]
    working_dir: /workspace
    env_file: [.env]
  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    volumes: ["./:/workspace"]
    working_dir: /workspace
    environment:
      EKI_API: http://api:8000
    depends_on: [api]
